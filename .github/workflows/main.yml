permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '27 3,9,15,21 * * *'

jobs:
  # Build the website and upload the static HTML files as an artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - run: |
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.142.0/hugo_extended_0.142.0_linux-amd64.deb
          echo "ed20a7c0b74482a3d036c549fd5eaca8c3ea4e74de0bd414193d16503768b44d hugo_extended_0.142.0_linux-amd64.deb" | sha256sum -c
          sudo dpkg -i hugo*.deb

      - run: hugo

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  # Deploy the artifact to GitHub pages.
  # This is a separate job so that only actions/deploy-pages has the necessary permissions.
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
